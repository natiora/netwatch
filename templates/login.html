<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetWatch Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#e6edf7;font-family:system-ui}.box{width:min(390px,90vw);background:#0e1625;border:1px solid #1e2a3d;border-radius:16px;padding:30px}.logo{font-size:28px;font-weight:900}.logo b{color:#5da9ff}input{width:100%;box-sizing:border-box;margin:7px 0 17px;padding:12px;background:#09111e;color:white;border:1px solid #304057;border-radius:9px}button{width:100%;padding:12px;border:0;border-radius:9px;background:#2878e8;color:white;font-weight:700}.err{padding:10px;background:#481d27;border-radius:8px;margin:12px 0}</style></head><body><div class="box"><div class="logo">Net<b>Watch</b></div><p style="color:#8d9aae">Monitoring réseau</p>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><label>Email</label><input name="email" type="email" value="admin@netwatch.local" required><label>Mot de passe</label><input name="password" type="password" required><button>Se connecter</button></form></div></body></html>
